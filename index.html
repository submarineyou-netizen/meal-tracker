<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192x192.png" />
    <link rel="manifest" href="/meal-tracker/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#667eea" />
    <link rel="apple-touch-icon" href="/icon-192x192.png" />
    <title>食事管理</title>
    <script type="module" crossorigin src="/meal-tracker/assets/index-DjqA7xyF.js"></script>
    <link rel="stylesheet" crossorigin href="/meal-tracker/assets/index-CSnZXpS9.css">
  </head>
  <body>
    <div id="root"></div>
    
    <!-- 日付自動更新スクリプト -->
    <script>
      (function() {
        // 現在の日付を取得
        function getTodayDate() {
          return new Date().toISOString().split('T')[0];
        }
        
        // 日付チェック
        function checkDateChange() {
          const today = getTodayDate();
          const lastAccessDate = localStorage.getItem('lastAccessDate');
          
          // 初回アクセスまたは日付が変わった場合
          if (!lastAccessDate || lastAccessDate !== today) {
            console.log('日付が更新されました:', lastAccessDate, '->', today);
            localStorage.setItem('lastAccessDate', today);
            
            // 日付が変わった場合はリロード（初回は除く）
            if (lastAccessDate && lastAccessDate !== today) {
              console.log('日付が変わったのでリロードします');
              window.location.reload();
            }
          }
        }
        
        // 初回チェック
        checkDateChange();
        
        // フォーカス時にチェック
        window.addEventListener('focus', checkDateChange);
        
        // visibilitychangeイベント（PWA対応）
        document.addEventListener('visibilitychange', function() {
          if (!document.hidden) {
            checkDateChange();
          }
        });
        
        // pagehsowイベント（iOS PWA対応）
        window.addEventListener('pageshow', checkDateChange);
        
        // 定期チェック（10秒ごと）
        setInterval(checkDateChange, 10000);
      })();
    </script>
  </body>
</html>
